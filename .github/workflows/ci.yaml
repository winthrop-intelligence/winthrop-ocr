name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 = winad_scrapers (consumer floor), 3.12 = winthrop-ocr-api heritage.
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.3.0

      - name: Install rendering system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest

      - name: Run pylint
        run: poetry run pylint ocr_engine

      - name: Build and smoke-test the installable artifact
        run: |
          poetry build
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "from ocr_engine import OcrDocumentError, ocr_document; import ocr_engine.adapters.mistral; from mistralai.client import Mistral"
